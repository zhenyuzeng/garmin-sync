# garmin-sync 日志轮转（newsyslog）
# 安装：sudo cp newsyslog.d/com.garmin-sync.conf /etc/newsyslog.d/
# ⚠️ 使用前把下方两行路径和 owner 中的 <用户名> 替换为你自己的用户名
# 超过 1MB 时轮转，保留 4 份，旧日志 gzip 压缩
# logfilename                                                    [owner:group]   mode count size when flags
/Users/<用户名>/Projects/garmin-sync/logs/stdout.log            <用户名>:staff  644  4     1024 *    Z
/Users/<用户名>/Projects/garmin-sync/logs/stderr.log            <用户名>:staff  644  4     1024 *    Z
